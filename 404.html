<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Michelle Pellon</title>
  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

  <!-- Fonts -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <meta name="theme-color" content="#ffffff">

  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url(/fonts/inter-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Playfair Display';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/playfair-display-italic-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --border-color: #e5e5e5;
      --max-width: 720px;
      --spacing-lg: 1.5rem;
      --spacing-3xl: 6rem;
    }

    html { font-size: 17px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-sans);
      line-height: 1.7;
      color: var(--text-primary);
      background: #fff;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--spacing-lg);
    }

    .serif { font-family: var(--font-serif); font-style: italic; }

    a {
      color: var(--text-primary);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .nav { padding: var(--spacing-lg) 0; }
    .nav-brand { font-weight: 600; text-decoration: none; }

    .content { padding: var(--spacing-3xl) 0; }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p { color: var(--text-secondary); margin-bottom: 1rem; }
  </style>
</head>

<body>
  <div class="container">
    <nav class="nav">
      <a href="/" class="nav-brand">Michelle Pellon</a>
    </nav>
    <main class="content">
      <h1>Page not found</h1>
      <p>This page doesn't exist. Or it did, and <span class="serif">its mandate is complete</span>.</p>
      <p>Try the <a href="/">homepage</a>.</p>
    </main>
  </div>
</body>
</html>
